<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Kebede Yimer Digital Café</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Navbar (same as index) -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Go Back</a>
            <!-- <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#menu">Menu</a></li>
                <li><a href="index.html#roasting">Roasting</a></li> 
            </ul> -->
            <div class="nav-actions">
                <button onclick="location.href='register.html'" class="register-btn">Register</button>
                <button onclick="toggleMobileMenu()" class="hamburger"><i class="fas fa-bars"></i></button>
            </div>
        </div>
        <ul id="mobile-menu" class="mobile-menu">
            <li><a href="index.html" onclick="toggleMobileMenu()">Home</a></li>
            <li><a href="index.html#menu" onclick="toggleMobileMenu()">Menu</a></li>
            <li><a href="index.html#roasting" onclick="toggleMobileMenu()">Roasting</a></li>
        </ul>
    </nav>

    <!-- Login Form -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box">
                <h2><i class="fas fa-sign-in-alt"></i> Welcome Back</h2>
                <p>Sign in to order your favorite coffee</p>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" placeholder="you@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="auth-btn">Login</button>
                </form>

                <p class="auth-switch">
                    Don't have an account? 
                    <a href="register.html">Register here</a>
                </p>
            </div>
        </div>
    </section>

   <script>
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const res = await fetch('api/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.status === "success") {
            alert(`✅ Welcome back, ${data.name}!`);
            window.location.href = "index.html";
        } else {
            alert("❌ " + data.message);
        }
    }
</script>
</body>
</html>
